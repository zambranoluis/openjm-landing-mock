<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -48 362 296">
  <defs>
    <style>
      .chat-dot { transform-box: fill-box; transform-origin: center; animation: chat-dot-bounce 1.5s cubic-bezier(.45, 0, .55, 1) infinite; }
      .chat-dot-2 { animation-delay: .18s; }
      .chat-dot-3 { animation-delay: .36s; }
      @keyframes chat-dot-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-11px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .chat-dot { animation: none; }
      }
    </style>
    <linearGradient id="bubble-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#104839"/>
      <stop offset="0.55" stop-color="#0a362a"/>
      <stop offset="1" stop-color="#0a1b17"/>
    </linearGradient>
    <filter id="outer-glow" filterUnits="userSpaceOnUse" x="-48" y="-48" width="362" height="296">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="edge-glow" filterUnits="userSpaceOnUse" x="-48" y="-48" width="362" height="296">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="dot-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <path d="M45 2h175c25 0 44 19 44 44v80c0 25-19 44-44 44H79l-39 28v-29C18 166 2 149 2 126V46C2 21 21 2 45 2Z" fill="none" stroke="#2deaa7" stroke-width="10" opacity=".4" filter="url(#outer-glow)"/>
  <path d="M45 2h175c25 0 44 19 44 44v80c0 25-19 44-44 44H79l-39 28v-29C18 166 2 149 2 126V46C2 21 21 2 45 2Z" fill="none" stroke="#46eeb0" stroke-width="5" opacity=".65" filter="url(#edge-glow)"/>
  <path d="M45 2h175c25 0 44 19 44 44v80c0 25-19 44-44 44H79l-39 28v-29C18 166 2 149 2 126V46C2 21 21 2 45 2Z" fill="url(#bubble-fill)" stroke="#50e3ae" stroke-width="2" stroke-linejoin="round"/>
  <g class="chat-dot chat-dot-1">
    <circle fill="#40d9a3" opacity=".55" filter="url(#dot-glow)" cx="90" cy="87" r="12"/>
    <circle fill="#41dca7" cx="90" cy="87" r="10.5"/>
  </g>
  <g class="chat-dot chat-dot-2">
    <circle fill="#40d9a3" opacity=".55" filter="url(#dot-glow)" cx="128" cy="87" r="12"/>
    <circle fill="#41dca7" cx="128" cy="87" r="10.5"/>
  </g>
  <g class="chat-dot chat-dot-3">
    <circle fill="#40d9a3" opacity=".55" filter="url(#dot-glow)" cx="166" cy="87" r="12"/>
    <circle fill="#41dca7" cx="166" cy="87" r="10.5"/>
  </g>
</svg>
